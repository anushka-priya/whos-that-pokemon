name: "Stale"

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security'
          stale-issue-message: >
            This issue has been inactive for 60 days and will be closed in
            14 days unless there's further activity. Comment here if it's
            still relevant.
          stale-pr-message: >
            This PR has been inactive for 60 days and will be closed in
            14 days unless there's further activity.