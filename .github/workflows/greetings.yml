name: "Greetings"

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          issue-message: >
            Thanks for opening your first issue here! Check out
            CONTRIBUTING.md if you're planning to submit a fix. Happy to
            answer questions in the thread.
          pr-message: >
            Thanks for your first PR! A maintainer will take a look soon.